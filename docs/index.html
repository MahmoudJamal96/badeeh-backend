<!DOCTYPE html>

<style>

  body{background:#050D1A;color:#CBD5E1;font-family:'Cairo',sans-serif;direction:rtl;min-height:100vh}
  .hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;

  .glow1{position:absolute;width:400px;height:400px;border-radius:50%;

  .glow2{position:absolute;width:300px;height:300px;border-radius:50%;

  .logo{width:90px;height:90px;border-radius:50%;
    background:radial-gradient(circle at 35% 32%,#1B3A6B,#071324);

    box-shadow:0 0 0 2.5px rgba(255,255,255,.12),0 0 40px rgba(16,185,129,.35);position:relative;
    margin-bottom:20px}
  .logo-dot{width:13px;height:13px;border-radius:50%;background:#F59E0B;
    position:absolute;bottom:10px;right:8px;box-shadow:0 0 10px rgba(245,158,11,.9)}
  h1{font-size:42px;font-weight:900;color:#fff;margin-bottom:12px;line-height:1.2}
  .sub{font-size:16px;color:#94A3B8;margin-bottom:30px;max-width:480px;line-height:1.9}
  .pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:36px}
  .pill{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.25);
    color:#34D399;border-radius:20px;padding:5px 14px;font-size:12px;font-weight:700}
  .cta{display:inline-flex;align-items:center;gap:10px;
    background:linear-gradient(135deg,#10B981,#059669);
    color:#fff;border-radius:16px;padding:16px 36px;font-size:16px;font-weight:800;
    text-decoration:none;box-shadow:0 6px 28px rgba(16,185,129,.4);margin-bottom:14px}
  .note{font-size:11px;color:#475569;margin-bottom:40px}
  .links{display:flex;gap:24px;justify-content:center;flex-wrap:wrap}
  .links a{font-size:13px;color:#64748B;text-decoration:none;
    border-bottom:1px solid rgba(100,116,139,.3);padding-bottom:2px}
  .links a:hover{color:#34D399;border-color:#34D399}
  footer{text-align:center;padding:20px;font-size:11px;color:#1E293B;
    border-top:1px solid rgba(255,255,255,.04)}

  <div class="pills">
    <div class="pill">📷 صوّر السؤال</div>
    <div class="pill">✨ حل فوري</div>

    <div class="pill">📚 جميع المواد</div>

  </a>

  <div class="links">

    <a href="mailto:support@nagahai.app">تواصل معنا</a>

</div>
<footer>© 2026 بَدِيه — جميع الحقوق محفوظة</footer>
